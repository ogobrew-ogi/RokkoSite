<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Страницата не е намерена | ROKKO</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230d1b2a'/><text y='.9em' font-size='70' x='50%' dominant-baseline='middle' text-anchor='middle' fill='%23c8a96e' font-family='serif' font-style='italic'>R</text></svg>">
    <meta name="theme-color" content="#0d1b2a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --navy: #0d1b2a;
            --sand: #c8a96e;
            --sky:  #a8d8ea;
            --white: #f7f9fb;
        }
        html, body { height: 100%; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--navy);
            color: var(--white);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(33,150,196,0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(26,95,122,0.10) 0%, transparent 55%);
        }
        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.75rem;
            font-weight: 300;
            color: var(--white);
            letter-spacing: 0.35em;
            text-decoration: none;
            margin-bottom: 3rem;
            display: block;
        }
        .logo span { color: var(--sand); }
        .code {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(5rem, 18vw, 10rem);
            font-weight: 300;
            line-height: 1;
            color: rgba(200, 169, 110, 0.15);
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
            user-select: none;
        }
        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.6rem, 4vw, 2.5rem);
            font-weight: 300;
            line-height: 1.2;
            margin-bottom: 1rem;
        }
        h1 em { font-style: italic; color: var(--sky); }
        p {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.5);
            line-height: 1.8;
            max-width: 380px;
            margin-bottom: 2.5rem;
        }
        .actions { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
        .btn {
            display: inline-block;
            padding: 0.85rem 2.2rem;
            font-size: 0.72rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: var(--sand);
            color: var(--navy);
            border: 1px solid var(--sand);
        }
        .btn-primary:hover { background: transparent; color: var(--sand); }
        .btn-outline {
            border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.7);
        }
        .btn-outline:hover { border-color: rgba(255,255,255,0.5); color: #fff; }
        .divider {
            width: 40px; height: 1px;
            background: rgba(200,169,110,0.3);
            margin: 2rem auto;
        }
    </style>
</head>
<body>
    <a href="/" class="logo">RO<span>K</span>KO</a>
    <div class="code" aria-hidden="true">404</div>
    <h1>Тази страница <em>изчезна</em><br>в синьото море</h1>
    <div class="divider"></div>
    <p>Страницата, която търсиш, не съществува или е преместена. Върни се към началото и разгледай нашите екскурзии.</p>
    <div class="actions">
        <a href="/" class="btn btn-primary">Към начало</a>
        <a href="/#contact" class="btn btn-outline">Свържи се с нас</a>
    </div>
</body>
</html>
